apiVersion: v1
kind: Service
metadata:
  name: preview-map
spec:
  ports:
  - name: http
    port: {{ .Values.serverConfig.port }}
    targetPort: {{ .Values.serverConfig.port }}
{{- if .Values.global.exposeNodePorts }}
    nodePort: 30110
  type: NodePort
{{- end }}
  selector:
    service: preview-map
