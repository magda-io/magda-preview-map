apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-map
spec:
  {{- if empty .Values.autoscaler.enabled }}
  replicas: {{ .Values.replicas | default 1 }}
  {{- end }}
  strategy:
    rollingUpdate:
      maxUnavailable: {{ .Values.global.rollingUpdate.maxUnavailable | default 0 }}
  selector:
    matchLabels:
      service: preview-map
  template:
    metadata:
      annotations:
        checksum/serverConfig: {{ .Values.serverConfig | mustToRawJson | sha256sum }}
      labels:
        service: preview-map
    spec:
      {{- include "magda.imagePullSecrets" . | indent 6 }}
      containers:
      - name: preview-map
        resources:
{{ toYaml .Values.resources | indent 10 }}
{{- if .Values.global.enableLivenessProbes }}
        livenessProbe:
          httpGet:
            path: ""
            port: 6110
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
{{- end }}
        env:
        - name: NODE_ENV
          value: production
        image: {{ include "magda.image" . | quote }}
        imagePullPolicy: {{ include "magda.imagePullPolicy" . | quote }}
        command: 
          - "node"
          - "node_modules/terriajs-server/lib/app.js"
          - "--config-file"
          - "/etc/config/serverConfig.json"
        volumeMounts:
          - name: server-config
            mountPath: /etc/config
      volumes:
        - name: server-config
          configMap:
            name: magda-map-preview-config
