apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-map
spec:
  {{- if empty .Values.autoscaler.enabled }}
  replicas: {{ .Values.replicas | default 1 }}
  {{- end }}
  strategy:
    rollingUpdate:
      maxUnavailable: {{ .Values.global.rollingUpdate.maxUnavailable | default 0 }}
  selector:
    matchLabels:
      service: preview-map
  template:
    metadata:
      annotations:
        checksum/serverConfig: {{ .Values.serverConfig | mustToRawJson | sha256sum }}
        checksum/clientConfig: {{ .Values.clientConfig | mustToRawJson | sha256sum }}
      labels:
        service: preview-map
    spec:
      {{- include "magda.imagePullSecrets" . | indent 6 }}
      containers:
      - name: preview-map
        resources:
{{ toYaml .Values.resources | indent 10 }}
        ports:
          - name: http
            containerPort: {{ .Values.serverConfig.port }}
{{- if .Values.global.enableLivenessProbes }}
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.serverConfig.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
{{- end }}
        env:
        - name: NODE_ENV
          value: production
        - name: SERVER_CONFIG_PATH
          value: /etc/config/serverConfig.json
        - name: CLIENT_CONFIG_PATH
          value: /etc/config/clientConfig.json
        - name: DEFAULT_CLIENT_CONFIG_PATH
          value: /app/default-client-config.json
        - name: RUNTIME_CLIENT_CONFIG_PATH
          value: /app/wwwroot/config.json
        image: {{ include "magda.image" . | quote }}
        imagePullPolicy: {{ include "magda.imagePullPolicy" . | quote }}
        volumeMounts:
          - name: server-config
            mountPath: /etc/config
            readOnly: true
      volumes:
        - name: server-config
          configMap:
            name: magda-map-preview-config
