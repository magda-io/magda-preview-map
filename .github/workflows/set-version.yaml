name: set-version

run-name: Set version ${{ inputs.version }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New semantic version with a leading v, for example v2.0.0-alpha.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  set-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Update package and chart versions
        env:
          SELECTED_VERSION: ${{ inputs.version }}
        run: yarn set-version "$SELECTED_VERSION"
      - name: Commit version
        env:
          SELECTED_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add package.json deploy/helm/magda-preview-map/Chart.yaml
          git commit -m "chore: set version ${SELECTED_VERSION}"
          git push
