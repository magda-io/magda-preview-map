name: Main CI Workflow

on: push

env:
  REPO_NAME: magda-preview-map

jobs:
  compatibility-contract:
    name: Magda preview compatibility contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/characterization/*.test.cjs

  build-test:
    name: Build and test TerriaMap foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build:production

      - name: helm-build-dependencies
        run: yarn update-all-charts

      - run: yarn helm-lint

      # Container publication returns in #31 with the Node 24 runtime and the
      # terriajs-server v5 deployment migration. The old Node 10 image cannot
      # execute the TerriaMap v0.4.8 toolchain adopted in #28.
