name: Main CI Workflow

on: push

permissions:
  contents: read

env:
  REPO_NAME: magda-preview-map

jobs:
  build-test:
    name: Build, test, and package TerriaMap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Build Helm dependencies
        run: yarn update-all-charts
      - run: yarn lint
      - run: yarn test
      - run: yarn build:production
      - name: Assert built client is prefix-safe (no absolute base href)
        run: |
          # The production default must emit NO absolute <base href="/">, or the
          # relative build/ assets break when served under a path prefix such as
          # Magda's gateway (/preview-map/). Guards against the build default
          # (gulp/webpack) regressing back to "/" — see #49.
          if grep -q '<base href="/"' wwwroot/index.html; then
            echo "::error::built wwwroot/index.html contains an absolute <base href=\"/\">, which breaks path-prefixed serving"
            exit 1
          fi

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run iframe integration tests
        run: yarn test:e2e

      - name: Lint Helm chart
        run: yarn helm-lint
      - name: Render Helm chart
        run: helm template preview-map deploy/helm/magda-preview-map -f deploy/helm/test-deploy.yaml >/dev/null
      - name: Check generated Helm README
        run: |
          yarn helm-docs
          git diff --exit-code -- README.md

  container-build:
    name: Build Node 24 production image
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: magda-preview-map:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
