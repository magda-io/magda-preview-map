name: Release image and Helm chart

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REPO_NAME: magda-preview-map
  S3_BUCKET: magda-charts

jobs:
  release:
    name: Publish Docker images and Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Build Helm dependencies
        run: yarn update-all-charts
      - run: yarn test
      - run: yarn build:production

      - name: Lint Helm chart
        run: yarn helm-lint
      - name: Verify release and chart versions match
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          CHART_VERSION=$(awk '/^version:/ { print $2 }' deploy/helm/${REPO_NAME}/Chart.yaml)
          test "${RELEASE_TAG#v}" = "$CHART_VERSION"

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: magdabot
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Generate compatible image tags
        id: image-metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/magda-io/magda-preview-map
            docker.io/data61/magda-preview-map
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
      - name: Build and publish Node 24 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.image-metadata.outputs.tags }}
          labels: ${{ steps.image-metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Publish Helm chart to the existing repository
        run: |
          mkdir -p deploy/helm/sync_dir deploy/helm/index_dir
          aws s3 cp s3://${S3_BUCKET}/index.yaml deploy/helm/index_dir/index.yaml
          helm package -d deploy/helm/sync_dir deploy/helm/${REPO_NAME}
          helm repo index --merge deploy/helm/index_dir/index.yaml deploy/helm/sync_dir
          aws s3 sync deploy/helm/sync_dir s3://${S3_BUCKET}/
          aws s3 cp deploy/helm/sync_dir/index.yaml s3://${S3_BUCKET}/index.yaml
