name: Release image and Helm chart

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REPO_NAME: magda-preview-map

jobs:
  release:
    name: Publish GHCR image and OCI Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Build Helm dependencies
        run: yarn update-all-charts

      - name: Validate release tag and repository versions
        id: release-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          SEMVER_REGEX="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          [[ "${RELEASE_TAG}" =~ ${SEMVER_REGEX} ]] || { echo "Invalid release tag '${RELEASE_TAG}': expected semantic version with leading v."; exit 1; }

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          CHART_VERSION=$(awk '/^version:/ { print $2 }' deploy/helm/${REPO_NAME}/Chart.yaml)
          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}" || { echo "Release tag ${RELEASE_TAG} does not match package.json version ${PACKAGE_VERSION}."; exit 1; }
          test "${RELEASE_TAG}" = "v${CHART_VERSION}" || { echo "Release tag ${RELEASE_TAG} does not match Helm chart version ${CHART_VERSION}."; exit 1; }
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Lint application
        run: yarn lint
      - name: Run tests
        run: yarn test
      - name: Build production application
        run: yarn build:production
      - name: Lint Helm chart
        run: yarn helm-lint
      - name: Render Helm chart
        run: helm template preview-map deploy/helm/magda-preview-map -f deploy/helm/test-deploy.yaml >/dev/null
      - name: Check generated Helm README
        run: |
          yarn helm-docs
          git diff --exit-code -- README.md

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-architecture Node 24 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/magda-io/magda-preview-map:${{ github.sha }}
            ghcr.io/magda-io/magda-preview-map:${{ steps.release-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package Helm chart
        run: helm package -d deploy/helm deploy/helm/${REPO_NAME}
      - name: Publish Helm chart to GitHub Container Registry
        run: helm push "deploy/helm/${REPO_NAME}-${{ steps.release-version.outputs.version }}.tgz" oci://ghcr.io/magda-io/charts
